services:
  # ========================
  # Staffup Frontend (Development)
  # ========================
  frontend:
    build:
      context: .
      target: development
    container_name: staffup-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000/api/v1
      - NEXT_PUBLIC_APP_NAME=Staffup LMS
      - WATCHPACK_POLLING=true

  # ========================
  # Staffup Frontend (Production)
  # ========================
  frontend-prod:
    build:
      context: .
      target: production
    container_name: staffup-frontend-prod
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_NAME=Staffup LMS
    profiles:
      - production
